# ==============================================================================
# SMARTseq HT scRNA-seq Pipeline Configuration
# Species: Mouse | Genome: mm10/GRCm39 | Platform: Apple Silicon Mac
# ==============================================================================

# ── Paths ──────────────────────────────────────────────────────────────────────
FASTQ_DIR: "/Users/zachortega/Documents/02092026_NOD_CD45_MHCII_RNAseq"
OUTPUT_DIR: "results"
REF_DIR: "reference"
HISAT2_INDEX: "reference/hisat2_index/GRCm39"

# ── Reference files ────────────────────────────────────────────────────────────
GENOME_FASTA: "reference/GRCm39.primary_assembly.genome.fa.gz"
GTF_FILE: "reference/gencode.vM33.primary_assembly.annotation.gtf.gz"

# ── FASTQ naming convention ────────────────────────────────────────────────────
# Pattern: {CELL_ID}_R1_001.fastq.gz / {CELL_ID}_R2_001.fastq.gz
# Example: B6G7_A1_S1_L001_R1_001.fastq.gz
R1_SUFFIX: "_R1_001.fastq.gz"
R2_SUFFIX: "_R2_001.fastq.gz"

# ── Trimmomatic ────────────────────────────────────────────────────────────────
TRIM_LEADING: 3
TRIM_TRAILING: 3
TRIM_SLIDINGWINDOW: "4:15"
TRIM_MINLEN: 36
ADAPTER_FILE: "TruSeq3-PE.fa"

# ── HISAT2 alignment ───────────────────────────────────────────────────────────
ALIGN_THREADS: 6

# ── featureCounts ──────────────────────────────────────────────────────────────
FC_THREADS: 6
FC_STRAND: 0
FC_PAIRED: true
FC_MIN_MAPQ: 10

# ── DESeq2 differential expression ────────────────────────────────────────────
METADATA_FILE: "/Users/zachortega/Desktop/MS_SMARTseq_Pipeline/data/metadata.csv"
# Design includes batch correction (L001 vs L002 plates) + condition + strain
# condition = cell population (CD45pos_MHCIIpos, CD45neg_MHCIIlo, CD45neg_MHCIIhi,
#             CD45neg_MHCIIpos, CD45neg_MHCIIpos_CD31neg, CD45neg_MHCIIpos_CD31pos)
# strain    = plate/genotype (B6G7, B6MHCIIGFP, NOD, NOD2, NODPDL1, NODCD31)
#
# WARNING: this global design is rank-deficient and has been since before
# NODCD31 — each strain sits in exactly one batch, so batch is fully determined
# by strain (rank 8 of 10 columns pre-NODCD31, 10 of 14 with it). NODCD31 adds a
# second dependency: it has no CD45pos_MHCIIpos wells, so its strain indicator is
# exactly the sum of its two CD31 condition indicators. DESeq2 will refuse this
# formula with "model matrix is not full rank". Drop `batch`, or model
# strain:condition, before relying on the global DESeq2 step in pipeline.py.
# The per-plate analysis in scripts/per_strain_plots.R uses `~ condition` within
# a single plate and is unaffected.
DESIGN_FORMULA: "~ batch + strain + condition"
# Reference condition for the global DESeq2 step. Per-plate references live in
# REF_CONDITION_OVERRIDES in scripts/per_strain_plots.R — NODCD31 is baselined on
# CD45neg_MHCIIpos_CD31neg because it has no CD45pos_MHCIIpos wells at all.
REFERENCE_LEVEL: "CD45pos_MHCIIpos"
PADJ_THRESHOLD: 0.05
LFC_THRESHOLD: 1.0
MIN_COUNTS: 10

# ── QC thresholds ─────────────────────────────────────────────────────────────
MIN_GENES_DETECTED: 500
MAX_GENES_DETECTED: 8000
MIN_READS_MAPPED: 500000
MIN_MAPPING_RATE: 0.60
