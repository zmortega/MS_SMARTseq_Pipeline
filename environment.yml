name: smartseq_ht
channels:
  - conda-forge
  - bioconda
  - defaults
dependencies:
  - python=3.11
  - star=2.7.11a
  - subread              # featureCounts
  - fastqc
  - trimmomatic
  - multiqc
  - samtools
  - r-base=4.3
  - bioconductor-deseq2
  - bioconductor-tximeta
  - r-tidyverse
  - r-pheatmap
  - r-ggrepel
  - r-rcolorbrewer
  - r-openxlsx
  - pip
  - pip:
    - pandas
    - numpy
    - matplotlib
    - seaborn
